              required: [reason]
      responses:
        '200':
          description: 'The request with `status: rejected`.'
        '400':
          description: A missing or malformed reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_ALREADY_DECIDED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
