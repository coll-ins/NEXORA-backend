                  rules: {allOf: [{$ref: '#/components/schemas/SaccoRules'}], nullable: true}
        '401': {description: "Unauthorized.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "Forbidden.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "Not found.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      summary: Publish the SACCO's first rules
      description: |-
        **Who:** the SACCO admin (`sacco.update`) or the platform owner.

        Only the first version. After that the rules are locked until the cycle ends (409 `RULES_LOCKED`) and change only by member vote. Amounts are whole cents. `interest_percent` has no default and must be sent. `loan_cap_multiple` defaults to 3 and `cycle_months` to 12. Every 400 carries `error.fields`, a plain-words reason for each bad field.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaccoRulesInput'}
      responses:
        '201':
          description: Published, version 1, cycle starts today.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: {$ref: '#/components/schemas/SaccoRules'}
        '400': {description: "A rule is missing or not valid (error.fields).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Unauthorized.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "Forbidden.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "Not found.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "The SACCO already has rules, locked or awaiting a vote (RULES_LOCKED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/saccos/{sacco_id}/rules/accept:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    post:
      summary: Accept the current rules
      description: '**Who:** an active member. Send the `version` you read. Idempotent.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer, example: 1}
              required: [version]
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: {$ref: '#/components/schemas/SaccoRules'}
        '401': {description: "Unauthorized.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "Only members accept rules.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "Not found, or no rules yet.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "The rules changed; read the current version.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/saccos/{sacco_id}/payment-details:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: Where members pay in
      description: '**Who:** any active member of the SACCO (`sacco.view`), or the platform owner. Returns
        `details` (the live values, or `null` when the SACCO has not set any) and `pending` (the change
        waiting for a second officer, or `null`). `pending` is only filled for holders of `payin.manage`;
        a member never sees a change before it is live. An approval by a second officer takes effect at
        once, so there is no window between approval and the values members see: `updated_at` is that approval.
        `bank_manual_confirm_only` is true when the bank uses a shared paybill.


        **Rate limit:** 120 per minute.'
      responses:
        '200':
          description: '`{details, pending}`. Members never get a pending change.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/payment-details/changes:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    post:
      summary: Propose new pay-in details
      description: '**Who:** holders of `payin.manage` (the SACCO admin and the finance officer). Changes
        nothing members see: the change waits until a different officer approves it. A newer proposal replaces
        the one waiting. Give M-Pesa details, bank details or both. M-Pesa: `mpesa_type` (`paybill`, `till` or `pochi`),
        `mpesa_number` (5 to 7 digits; for `pochi` a Safaricom phone number, shown to members but never prompted), `display_name`, optional `account_reference_hint` (paybill only). Bank:
        `bank_name`, `bank_account_name`, `bank_account_number` (6 to 20 digits), optional `bank_branch`. Shared
        bank paybill: `bank_uses_shared_paybill` true with `bank_paybill_number` (5 to 7 digits). Every proposal
        is audited (`payin.propose`, `payin.supersede`) and every officer is emailed. Text fields take Latin
        letters, ASCII digits and ordinary punctuation on one line (invisible, look-alike and
        non-Latin letters are refused). A SACCO may send 10 proposals an hour (429).


        **Rate limit:** 30 per minute.'
      responses:
        '201':
          description: '`{change}` with `status: pending`.'
        '400':
          description: A field is not valid. `error.fields` names each one with its format, an example and the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: These are the details members already see (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mpesa_type:
                  type: string
                  enum:
                  - paybill
                  - till
                  - pochi
                mpesa_number:
                  type: string
                display_name:
                  type: string
                account_reference_hint:
                  type: string
                bank_name:
                  type: string
                bank_account_name:
                  type: string
                bank_account_number:
                  type: string
                bank_branch:
                  type: string
                bank_uses_shared_paybill:
                  type: boolean
                bank_paybill_number:
                  type: string
  /api/v1/saccos/{sacco_id}/payment-details/changes/{change_id}/approve:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    - name: change_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Approve a waiting change, which puts it live at once
      description: '**Who:** holders of `payin.manage`, never the officer who proposed the change
        (403 `PAYIN_SAME_OFFICER`). The change is named by id, so nobody approves values that changed
        after they read them. The approver must have become an officer before the change was proposed
        (403 `PAYIN_NEW_OFFICER`), and the proposer must still be an officer (409). Officer since is the
        earliest `granted_at` of a title that carries `payin.manage` (editing other titles keeps it);
        an admin with no title rows counts from when the membership was created. Audited as
        `payin.approve`. The approval is the moment it takes effect: the values members see change in the
        same request, with no waiting period. Every officer (the admin included) is emailed, without the
        numbers, and members get no email. Everyone is also emailed when someone gains
        `payin.manage` (member add, role or title change).


        **Rate limit:** 30 per minute.'
      responses:
        '200':
          description: '`{change}` with `status: approved`, `approved_at` and `go_live_at` (the same moment). Members see the new details from now on.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not allowed, you proposed this change (`PAYIN_SAME_OFFICER`), or you became an officer after it was proposed (`PAYIN_NEW_OFFICER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The change was already approved or replaced, or its proposer is no longer an officer (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/rules/proposals:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: Proposed rule changes
      description: '**Who:** any active member. The ten newest, with the vote count and the caller''s own vote.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Proposals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals: {type: array, items: {type: object}}
        '401': {description: "Unauthorized.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "Forbidden.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "Not found.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      summary: Propose a rule change
      description: '**Who:** the SACCO admin or the platform owner, only after the cycle has ended (409 `RULES_LOCKED` before). Send the full set of rules. One open proposal at a time.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaccoRulesInput'}
      responses:
        '201':
          description: Open for a vote.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: {type: object}
        '400': {description: "A rule is missing or not valid (error.fields).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Unauthorized.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "Forbidden.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "Not found.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "Still locked, nothing to change yet, a proposal is already open, nobody has accepted the current rules, or fewer than half of all active members have (the change could not pass).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/saccos/{sacco_id}/rules/proposals/{proposal_id}/votes:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    - name: proposal_id
      in: path
      required: true
      schema: {type: integer}
    post:
      summary: Vote on a proposed change
      description: '**Who:** an active member. More than half of ALL active members counted when it was proposed (not only those who accepted the rules) must approve; then it is adopted as the next version and starts a new cycle. The acceptance of members who voted yes carries over to the new version; members who voted no, or did not vote, must accept it again before they can ask for a loan. It is rejected once it can no longer win. A member may change their vote while it is open.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: {type: boolean}
              required: [approve]
      responses:
        '200':
          description: The proposal with its tally.
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: {type: object}
        '400': {description: "approve must be true or false.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Unauthorized.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "Only members vote.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "Not found.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "Voting has closed.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/saccos/{sacco_id}/members/me/data-consent:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: The data-protection wording and my consent
      description: '**Who:** an active member of the SACCO. Returns `notice` (`version`, `purpose`, `text`) and
        `consent` (`purpose`, `notice_version`, `granted_at`, or `null`).


        **Rate limit:** 120 per minute.'
      responses:
        '200':
          description: '`{notice, consent}`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
    post:
      summary: Agree to NEXORA keeping my personal details
      description: '**Who:** the member, for themself only (nobody can consent for someone else). Send the
        `notice_version` you read; another version is 409. Personal details (full name, national ID,
        gender, date of birth) can be stored only while this consent is active. Repeating it returns the
        existing consent (200). Audited as `consent.grant`.


        **Rate limit:** 30 per minute.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notice_version: {type: integer, example: 1}
              required: [notice_version]
      responses:
        '201':
          description: '`{consent}`: new.'
        '200':
          description: '`{consent}`: already given.'
        '400':
          description: '`notice_version` missing or not a whole number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The wording changed since the member read it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/members/me/data-consent/withdraw:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    post:
      summary: Withdraw consent; my personal details are erased
      description: '**Who:** the member. Works for the member''s own membership whatever its status, even after deactivation or suspension. Ends the consent and erases full name, national ID, gender and date of
        birth at once. Savings, loans, share capital and the audit trail stay. Audited as
        `consent.withdraw` with the names of the erased fields, never the values.


        **Rate limit:** 30 per minute.'
      responses:
        '200':
          description: '`{consent: null, erased: [field names]}`.'
        '409':
          description: No active consent to withdraw.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/members/{membership_id}/profile:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    - name: membership_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: A member's personal details, share capital and consent
      description: '**Who:** the member themself, or a holder of `member.manage` (the SACCO admin). Nobody
        else, the platform owner included. Personal details never appear in the member list.


        **Rate limit:** 120 per minute.'
      responses:
        '200':
          description: '`{membership_id, full_name, national_id, gender, date_of_birth, share_capital, consent}`. Every field can be `null`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
    patch:
      summary: Set a member's personal details or share capital
      description: '**Who:** the member themself or a holder of `member.manage`; `national_id` and
        `share_capital` only by a holder of `member.manage` (403 otherwise: a member who could set their own
        ID could probe which numbers other members hold). Send any of `full_name` (2 to 120 letters, spaces, `''`
        `.` `-`), `national_id` (7 or 8 digits, unique within the SACCO), `gender` (`female`, `male`,
        `other`), `date_of_birth` (`YYYY-MM-DD`, 1900 to today), `share_capital` (whole minor units, zero
        or more). `null` or an empty string clears a field. Every field is optional. Setting a personal
        detail needs the member''s own active consent (409 `CONSENT_REQUIRED`); clearing one and
        `share_capital` do not. Audited as `member.profile_update` with the field names only.


        **Rate limit:** 30 per minute.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: {type: string, nullable: true}
                national_id: {type: string, nullable: true}
                gender: {type: string, enum: [female, male, other], nullable: true}
                date_of_birth: {type: string, format: date, nullable: true}
                share_capital: {type: integer, minimum: 0, nullable: true}
      responses:
        '200':
          description: The updated profile (same shape as GET).
        '400':
          description: Unknown field, no field, or a bad value (`validation_error`, `error.fields`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`CONSENT_REQUIRED`, or the national ID is already used by another member of this SACCO.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/deposit-controls:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: The SACCO's deposit-control thresholds
      description: '**Who:** `sacco.update` or `report.view`. Returns the thresholds in force (the defaults
        when none are saved) and `defaults`. Amounts are minor units.


        **Rate limit:** read limit.'
      responses:
        '200':
          description: '`{auto_confirm_limit, large_amount_limit, manual_flag_limit, repeat_count, repeat_window_hours, quick_withdrawal_hours, defaults}`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
    put:
      summary: Change the deposit-control thresholds
      description: '**Who:** `sacco.update` (the SACCO admin). Send any of the settings; the rest keep their
        value. `auto_confirm_limit` (0 to 500000, default 0: every deposit waits for an officer; a
        deposit at or under it, with no flag, posts at once after a paid M-Pesa prompt),
        `large_amount_limit` (100 to 20000000, default 10000000), `manual_flag_limit` (100 to 5000000, default 2000000),
        `repeat_count` (2 to 20, default 3), `repeat_window_hours` (1 to 720, default 24),
        `quick_withdrawal_hours` (1 to 720, default 24). The large-amount flag also adds up a member''s payments over `repeat_window_hours`, so splitting does not avoid it. Audited as
        `deposit_controls.set`, and the officers are emailed.


        **Rate limit:** write limit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_confirm_limit: {type: integer}
                large_amount_limit: {type: integer}
                manual_flag_limit: {type: integer}
                repeat_count: {type: integer}
                repeat_window_hours: {type: integer}
                quick_withdrawal_hours: {type: integer}
      responses:
        '200':
          description: The thresholds now in force.
        '400':
          description: An unknown key, or a value out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/flagged-payments:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: The audit report of flagged payments
      description: '**Who:** `report.view` (SACCO admin, finance officer, secretary). The newest 200 payment
        requests that carry a flag, with who gave the first and the second approval. `labels` maps a flag
        code to its plain-language name.


        **Rate limit:** read limit.'
      responses:
        '200':
          description: '`{items: [{id, member, kind, source, amount_minor, mpesa_receipt, flags, status, first_approved_by, second_approved_by, decided_by, ledger_transaction_id, created_at}], labels}`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/reconciliation:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: The ledger against the STK records
      description: '**Who:** `report.view`. Compares every paid STK push with the deposit it produced and
        lists what does not match (`mismatches`, each with a `kind`: `paid_not_recorded`,
        `amount_differs`, `paid_but_rejected`, `paid_not_credited` (paid over a day ago, still
        unconfirmed), `ledger_missing`, `ledger_amount_differs`, `credit_reversed`, `no_paid_push`).
        `unverified_manual` lists manual receipts no callback has matched: not a mismatch, because a
        member may pay the paybill directly. Nothing is changed; the ledger is never edited. Audited as
        `ledger.reconcile_mpesa`.


        **Rate limit:** read limit.'
      responses:
        '200':
          description: '`{checked, ok, mismatches, unverified_manual}`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/daraja-settings:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: Whether this SACCO has its own Daraja credentials saved
      description: '**Who:** `sacco.update` (the SACCO admin). Off by default: with `DARAJA_ENABLED` unset this
        route answers 404. Returns `{configured: false}` or `{configured: true, shortcode, updated_at}`.
        The secrets are never returned.


        **Rate limit:** read limit.'
      responses:
        '200':
          description: '`{configured, shortcode?, updated_at?}`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
    put:
      summary: Save this SACCO's own Daraja credentials (encrypted at rest)
      description: '**Who:** `sacco.update` (the SACCO admin). Off by default (404). Send `shortcode` (5 to 7
        digits: the paybill, or the head-office number of a till), `consumer_key`, `consumer_secret` and
        `passkey` (printable, no spaces). They are stored encrypted with `DARAJA_ENCRYPTION_KEY` and never
        returned or logged; the audit row (`daraja.credentials_set`) names the fields, not the values.
        Saving again replaces them. Answers 503 if the encryption key is not set. In production these are the only credentials a push can use.


        **Rate limit:** write limit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shortcode: {type: string, example: '600123'}
                consumer_key: {type: string}
                consumer_secret: {type: string}
                passkey: {type: string}
              required: [shortcode, consumer_key, consumer_secret, passkey]
      responses:
        '200':
          description: '`{configured: true, shortcode}`.'
        '400':
          description: A field is missing or not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`DARAJA_ENCRYPTION_KEY` is not set, so nothing can be saved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/stk-push:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    post:
      summary: Ask M-Pesa to prompt my phone
      description: '**Who:** an active member (`savings.request`). **Off by default:** with
        `DARAJA_ENABLED` unset this route answers 404 as if it did not exist. `DARAJA_ENV` picks Safaricom''s
        sandbox (default) or live API; a production app starts with Daraja on only for `DARAJA_ENV=production`
        (see `docs/deployment-checklist.md`). Send `amount` (minor units, whole shillings, KES 1 to KES 150,000) and
        `phone` (07.., 01.. or 254..). At most 3 prompts may wait per member (429). The member then enters their M-Pesa PIN on the phone. Nexora holds no
        funds: a paid answer becomes a pending deposit that an officer confirms (or that posts at once
        under the SACCO''s auto-confirm limit, if it set one).


        The prompt uses the SACCO''s own saved Daraja credentials (see `daraja-settings`); in the
        sandbox, with none saved, the environment''s shared sandbox keys. **In production there is no
        fallback:** a SACCO with no saved credentials answers 409, and the approved pay-in details must
        exist and, for a paybill, match the saved shortcode (409 otherwise). If the live pay-in is a till (`mpesa_type` `till`) the request is
        `CustomerBuyGoodsOnline` to that till; a paybill is `CustomerPayBillOnline`. A SACCO that takes
        Pochi la Biashara (`pochi`) is record only: the route answers 409. A SACCO with no usable
        credentials also answers 409.


        **Rate limit:** money limit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: {type: integer, example: 10000}
                phone: {type: string, example: '0712345678'}
              required: [amount, phone]
      responses:
        '201':
          description: '`{id, status: pending, amount, phone_last3, message, created_at}`.'
        '400':
          description: Bad amount or phone (`validation_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pochi la Biashara is record only, or the SACCO has no usable M-Pesa credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: M-Pesa did not answer or refused. The attempt is recorded as `failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/stk-push/{push_id}:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    - name: push_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: The answer to one STK push
      description: '**Who:** the member who asked, or a holder of `member.manage`; anyone else gets 404.
        `status` is `pending`, `succeeded` or `failed`. 404 while the feature is off.


        **Rate limit:** 120 per minute.'
      responses:
        '200':
          description: '`{id, status, amount, phone_last3, message, created_at}`.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
  /api/v1/daraja/callback/{token}:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Safaricom's answer to an STK push
      description: 'Called by Safaricom, not by the app. The unguessable `token` in the path is the only
        secret (`DARAJA_CALLBACK_TOKEN`); a wrong token is 404. Always acknowledges with
        `{ResultCode: 0}`, even for an unknown or repeated answer, and changes nothing for those. A
        success whose amount differs from the request is recorded as `failed`; a paid one creates a pending
        deposit for an officer (see `deposit-controls`). 404 while the feature is off.'
      responses:
        '200':
          description: Acknowledged.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/saccos/{sacco_id}/settings:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: The SACCO's loan rules
      description: '**Who:** any active member of the SACCO (`sacco.view`), or the platform owner. Defaults are returned
        until the owner changes them.'
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
    patch:
      summary: Change the SACCO's loan rules
      description: '**Who:** platform owner only. Send any of the fields; whole numbers only.'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loan_cap:
                  type: integer
                  minimum: 0
                savings_multiple:
                  type: integer
                  minimum: 0
                join_code_ttl_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                required_approvals:
                  type: integer
                  minimum: 1
                  maximum: 2
  /api/v1/loans/saccos/{sacco_id}:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: Loans in a SACCO, newest first
      description: '**Who:** any active member. Officers (`loan.view`) see every loan; a member sees only
        their own.'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: A page of loans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Loan'
                  page:
                    type: integer
                  per_page:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
    post:
      summary: Request a loan
      description: '**Who:** an active member with a savings account (`loan.request`). One open loan per
        member (409). Within both the SACCO cap and the savings multiple the loan needs 1 approval; above
        either it needs the SACCO''s `required_approvals` (a cap of 0 sends every loan there). The count is
        frozen on the loan. Optional `sector` (one of the Loan `sector` values; null or empty means not
        given) and `disclosure_acknowledged` (true records `disclosure_acknowledged_at`); anything else is
        400. Neither is required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principal: {type: integer, description: Minor units.}
                term_months: {type: integer, minimum: 1, maximum: 360}
                sector: {type: string, nullable: true}
                disclosure_acknowledged: {type: boolean}
              required: [principal, term_months]
      responses:
        '201':
          description: The new loan, status `requested`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principal:
                  type: integer
                  minimum: 1
                  description: Minor units.
                term_months:
                  type: integer
                  minimum: 1
                  maximum: 360
              required:
              - principal
              - term_months
  /api/v1/loans/{loan_id}:
    parameters:
    - $ref: '#/components/parameters/loan_id'
    get:
      summary: One loan with its decisions
      description: '**Who:** the borrower, or an officer of the SACCO (`loan.view`). Anyone else gets 404.'
      responses:
        '200':
          description: The loan, plus a `decisions` list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
  /api/v1/loans/{loan_id}/decisions:
    parameters:
    - $ref: '#/components/parameters/loan_id'
    post:
      summary: Approve or reject one step
      description: '**Who:** loans officer (`loan.approve`; a SACCO admin never approves), never the borrower, and a different
        officer for each step. Steps go in order; the last required approval sets `approved`, a rejection
        ends the loan.'
      responses:
        '201':
          description: The loan after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                step:
                  type: integer
                  minimum: 1
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                reason:
                  type: string
                  maxLength: 500
                  description: Required for a rejection.
              required:
              - step
              - decision
  /api/v1/loans/{loan_id}/disbursements:
    parameters:
    - $ref: '#/components/parameters/loan_id'
    post:
      summary: Pay out an approved loan
      description: '**Who:** finance officer (`loan.disburse`) who approved no step (`LOAN_SAME_OFFICER`).
        Credits the principal to the borrower''s savings account. The ledger row cannot be reversed. In a SACCO with published rules the cap and the pool are checked again at payout under the SACCO lock (409 `LOAN_OVER_CAP`, `LOAN_POOL_SHORT`).'
      responses:
        '201':
          description: The loan, status `disbursed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference:
                  type: string
                  pattern: ^[A-Za-z0-9._:-]{1,64}$
                  description: Required idempotency key, unique per SACCO.
              required:
              - reference
  /api/v1/loans/{loan_id}/repayments:
    parameters:
    - $ref: '#/components/parameters/loan_id'
    post:
      summary: Repay a disbursed loan from savings
      description: '**Who:** the borrower, or a finance officer. Debits the borrower''s savings account;
        the loan becomes `repaid` when the principal is covered. The ledger row cannot be reversed.'
      responses:
        '201':
          description: The repayment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repayment_id:
                    type: integer
                  loan_id:
                    type: integer
                  transaction_id:
                    type: integer
                  amount:
                    type: integer
                  repaid_total:
                    type: integer
                  loan_status:
                    type: string
                  account_balance:
                    type: integer
                  reference:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  minimum: 1
                  description: Minor units. Integers only.
                reference:
                  type: string
                  pattern: ^[A-Za-z0-9._:-]{1,64}$
                  description: Required idempotency key, unique per SACCO.
              required:
              - amount
              - reference
  /api/v1/admin/owners:
    get:
