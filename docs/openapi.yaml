  /api/v1/admin/owners/{user_id}:
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Revoke a platform owner
      description: '**Who:** platform owner only. Nobody revokes themselves (403); at least two owners always
        remain (409). The revoked owner loses platform access on their next request.'
      responses:
        '200':
          description: The owners that remain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owners:
                    type: array
                    items:
                      $ref: '#/components/schemas/Owner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
  /api/v1/members/me/saccos:
    get:
      summary: Every SACCO I belong to
      description: '**Who:** any signed-in user. One login covers every SACCO: a SACCO-scoped request
        names its SACCO, and the membership is checked again on every request (no re-login to switch).
        A suspended SACCO is listed with `status: suspended`.'
      responses:
        '200':
          description: My SACCOs, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saccos:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - active
                          - suspended
                        currency:
                          type: string
                        membership_id:
                          type: integer
                        membership_status:
                          type: string
                          enum:
                          - invited
                          - active
                          - inactive
                        roles:
                          type: array
                          items:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - bearerAuth: []
  /api/v1/saccos/{sacco_id}/support-access:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: Support-access requests for a SACCO, newest first
      description: '**Who:** the SACCO''s admin, or a platform owner. Approvals whose time is up are shown
        as expired.'
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
    post:
      summary: Ask to read one scope of a SACCO's data
      description: '**Who:** a platform owner. A platform owner reads SACCO data (audit, members, savings,
        loans) only through an approved grant for that scope, read-only, while it lasts (at most 24
        hours). Every read under a grant writes an audit row with the grant id. There is no bypass.'
      responses:
        '201':
          description: The request, status `requested`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                scope:
                  type: string
                  enum:
                  - audit
                  - members
                  - savings
                  - loans
              required:
              - reason
              - scope
  /api/v1/support-access/{request_id}/approve:
    parameters:
    - $ref: '#/components/parameters/request_id'
    post:
      summary: Approve a support-access request
