openapi: 3.0.3
info:
  title: Nexora API
  version: 1.2.0
  description: 'Backend API for multi-tenant SACCO management. Every resource route is served under /api/v1;
    the health check is unversioned.


    **Errors** on every route: `{"error": {"code": "not_found", "message": "Not found."}}`. Codes: 400
    validation_error, 401 unauthorized, 403 forbidden, 404 not_found, 405 method_not_allowed, 409 conflict,
    413 payload_too_large, 423 locked, 429 rate_limited, 500 internal_error.


    **Tenancy:** another SACCO''s records answer 404, never 403. A suspended SACCO answers 423.


    **Money** is an integer in minor units (KES: 100 = 1.00). Money routes need a `reference` (idempotency
    key).


    **Pagination:** `page` from 1 and `per_page` (default 20, capped at 100); a bad value is 400.


    **Auth:** `Authorization: Bearer <access_token>`. Access tokens last 15 minutes and stop working at
    once after change-password, reset-password, logout-all or an email change.'
servers:
- url: http://localhost:5000
  /api/v1/members/me/permissions:
    get:
      summary: The caller's job titles and permissions in one SACCO
      description: '**Who:** a signed-in user. Without `sacco_id`, a platform owner
        gets the platform permissions.


        **Rate limit:** 120 per minute.'
      parameters:
      - name: sacco_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: The job titles held and the permissions they give.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
        '400':
          description: sacco_id missing or not a number (`validation_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not a member of that SACCO (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/savings/requests:
    post:
      summary: Send a deposit or withdrawal request
      description: '**Who:** a member holding `savings.request`. A request changes no
        balance.


        **Rate limit:** 20 per minute.'
      responses:
        '201':
          description: The pending request.
        '200':
          description: The same reference again returns the original request.
        '400':
          description: A field is missing or not acceptable (`validation_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No `savings.request` in this SACCO (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`INSUFFICIENT_FUNDS` for a withdrawal above the balance,
            `DUPLICATE_REFERENCE` for a reused reference.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The SACCO is suspended (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/savings/requests/me:
    get:
      summary: The caller's own requests in one SACCO
      description: '**Who:** the member themselves. Newest first.


        **Rate limit:** 120 per minute.'
      parameters:
      - name: sacco_id
        in: query
        required: true
        schema:
          type: integer
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - deposit
          - withdrawal
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: '`{items, next}`; `next` is null on the last page.'
        '404':
          description: Not a member of that SACCO (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/savings/saccos/{sacco_id}/requests:
    get:
      summary: One SACCO's request queue
      description: '**Who:** a member holding `savings.post`. Each item also names the
        requester''s email.


        **Rate limit:** 30 per minute.'
      parameters:
      - $ref: '#/components/parameters/sacco_id'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - confirmed
          - rejected
      responses:
        '200':
          description: '`{items, next}`; newest first.'
        '403':
          description: No `savings.post` in this SACCO (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/savings/requests/{request_id}/confirm:
    post:
      summary: Confirm one pending request and post its ledger entry
      description: '**Who:** a member holding `savings.post`, never the requester.


        **Rate limit:** 20 per minute.


        `reference` is required, except for a payment that carries an M-Pesa receipt (`source` `stk` or
        `manual`): that posts under `mpesa-<receipt>` whatever is sent, so one receipt can reach the
        ledger once. A **flagged** request (`flags` not empty) needs two different officers: the first
        confirm records the first approval and answers the request still `pending` with
        `awaiting_second_approval: true`; a second officer''s confirm posts it. The first approver
        confirming again is 403 `SECOND_OFFICER_REQUIRED`. Flags are `large_amount`,
        `manual_over_limit`, `repeated_amount`, `quick_withdrawal`.'
      responses:
        '200':
          description: 'The request with `status: confirmed` and `ledger_transaction_id`, or, for the first approval of a flagged one, still `pending`.'
        '403':
          description: '`forbidden`, `OWN_REQUEST` when the officer asked for it, or `SECOND_OFFICER_REQUIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`REQUEST_ALREADY_DECIDED`, or `INSUFFICIENT_FUNDS` for a withdrawal.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/savings/requests/{request_id}/reject:
    post:
      summary: Reject one pending request
      description: '**Who:** a member holding `savings.post`, never the requester. A
        reason is required; no balance changes.


        **Rate limit:** 30 per minute.'
      responses:
        '200':
          description: 'The request with `status: rejected` and `reject_reason`.'
        '400':
          description: No reason, or one longer than 500 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`REQUEST_ALREADY_DECIDED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    request_id:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
    loan_id:
      name: loan_id
      in: path
      required: true
      schema:
        type: integer
    sacco_id:
      name: sacco_id
      in: path
      required: true
      schema:
        type: integer
    membership_id:
      name: membership_id
      in: path
      required: true
      schema:
        type: integer
    account_id:
      name: account_id
      in: path
      required: true
      schema:
        type: integer
    transaction_id:
      name: transaction_id
      in: path
      required: true
      schema:
        type: integer
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number.
    per_page:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Rows per page, capped at 100.
    from:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive start date, strictly YYYY-MM-DD (ASCII digits). Must not be after `to`.
    to:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Inclusive end date, YYYY-MM-DD.
    action:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
      description: Exact action name, or a prefix ending in `.` such as `savings.`.
  responses:
    BadRequest:
      description: Validation error (`validation_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired access token (`unauthorized`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Signed in but not allowed (`forbidden` or `NOT_ALLOWED`, `LOAN_SAME_OFFICER`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, including another SACCO's record (`not_found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Conflicts with current state (`conflict`, `DUPLICATE_REFERENCE`, `INSUFFICIENT_FUNDS`,
        `LOAN_NEEDS_APPROVAL`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Locked:
      description: The SACCO is suspended (`locked`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SaccoRulesInput:
      type: object
      description: Amounts are whole cents (50000 = KES 500.00).
      properties:
        contribution_amount: {type: integer, minimum: 1, example: 50000}
        contribution_frequency: {type: string, enum: [weekly, twice_monthly, monthly]}
        loan_cap_multiple: {type: integer, minimum: 1, maximum: 10, default: 3, description: Times a member's savings they may borrow.}
        interest_percent: {type: number, minimum: 0, maximum: 100, example: 10, description: "Required, no default. Recorded; NEXORA does not collect it yet."}
        repayment_period_value: {type: integer, minimum: 1, example: 6}
        repayment_period_unit: {type: string, enum: [days, months]}
        late_fine_amount: {type: integer, minimum: 0, example: 5000, description: "Flat amount per late payment. Recorded; not charged yet."}
        cycle_months: {type: integer, minimum: 9, maximum: 12, default: 12}
        guarantors_required: {type: integer, minimum: 0, maximum: 10, default: 0, description: Recorded only.}
        min_membership_days: {type: integer, minimum: 0, maximum: 730, default: 0}
        exit_rules: {type: string, maxLength: 500}
        loan_purposes: {type: string, maxLength: 200}
      required: [contribution_amount, contribution_frequency, interest_percent, repayment_period_value, repayment_period_unit, late_fine_amount]
    SaccoRules:
      allOf:
      - $ref: '#/components/schemas/SaccoRulesInput'
      - type: object
        properties:
          id: {type: integer}
          version: {type: integer}
          cycle_starts_on: {type: string, format: date}
          cycle_ends_on: {type: string, format: date}
          locked: {type: boolean}
          accepted: {type: boolean, nullable: true}
    Loan:
      type: object
      properties:
        id:
          type: integer
        sacco_id:
          type: integer
        membership_id:
          type: integer
        principal:
          type: integer
          description: Minor units.
        term_months:
          type: integer
          nullable: true
        required_approvals:
          type: integer
        approvals_count:
          type: integer
        repaid_total:
          type: integer
        status:
          type: string
          enum:
          - requested
          - approved
          - rejected
          - disbursed
          - repaid
        disbursed_by_membership_id:
          type: integer
          nullable: true
        disbursed_at:
          type: string
          format: date-time
          nullable: true
        disbursement_transaction_id:
          type: integer
          nullable: true
          description: The ledger row that paid the loan out. It cannot be reversed.
        created_at:
          type: string
          format: date-time
        sector:
          type: string
          nullable: true
          enum: [agriculture, trade, manufacturing, transport, housing, education, health, other]
          description: What the loan is for. Optional; set when the loan is requested.
        disclosure_acknowledged_at:
          type: string
          format: date-time
          nullable: true
          description: When the borrower confirmed they were shown the cost of the loan. Optional; recorded only.
    SupportAccess:
      type: object
      properties:
        id:
          type: integer
        sacco_id:
          type: integer
        requested_by_user_id:
          type: integer
        reason:
          type: string
        scope:
          type: string
          enum:
          - audit
          - members
          - savings
          - loans
        status:
          type: string
          enum:
          - requested
          - approved
          - denied
          - revoked
          - expired
        decided_by_membership_id:
          type: integer
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_by_membership_id:
          type: integer
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    Owner:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
    Settings:
      type: object
      properties:
        sacco_id:
          type: integer
        loan_cap:
          type: integer
          description: Largest principal in minor units; 0 means no cap.
        savings_multiple:
          type: integer
          description: A loan may be at most this many times the borrower's savings.
        join_code_ttl_minutes:
          type: integer
        required_approvals:
          type: integer
          enum:
          - 1
          - 2
    Roles:
      type: object
      properties:
        membership_id:
          type: integer
        roles:
          type: array
          items:
            type: string
            enum:
            - sacco_admin
            - secretary
            - finance_officer
            - loans_officer
            - member
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    Sacco:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        currency:
          type: string
          example: KES
        status:
          type: string
          enum:
          - active
          - suspended
        member_count:
          type: integer
          description: Active members. An invitation is not a member yet.
        created_at:
          type: string
          format: date-time
        registration_number:
          type: string
          nullable: true
          example: CS/12345
          description: Optional. 3 to 40 characters (letters, digits, space, `.` `/` `-`), unique among SACCOs in any case. Recorded as given, not checked with any register.
        sasra_licence_number:
          type: string
          nullable: true
          example: SASRA/DT/0042/2024
          description: Optional. Same format and uniqueness as `registration_number`.
        registration_date:
          type: string
          format: date
          nullable: true
          description: Optional, `YYYY-MM-DD`, from 1900-01-01 up to today.
    Member:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum:
          - member
          - staff
          - sacco_admin
        status:
          type: string
          enum:
          - active
          - inactive
        created_at:
          type: string
          format: date-time
    Profile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        created_at:
          type: string
          format: date-time
        memberships:
          type: array
          items:
            type: object
            properties:
              membership_id:
                type: integer
              sacco_id:
                type: integer
              role:
                type: string
              status:
                type: string
    Account:
      type: object
      properties:
        id:
          type: integer
        membership_id:
          type: integer
        sacco_id:
          type: integer
        balance:
          type: integer
          description: Minor units.
        created_at:
          type: string
          format: date-time
    AccountRow:
      type: object
      properties:
        account_id:
          type: integer
        membership_id:
          type: integer
        email:
          type: string
        balance:
          type: integer
    Posted:
      type: object
      properties:
        id:
          type: integer
        account_id:
          type: integer
        type:
          type: string
          enum:
          - deposit
          - withdrawal
        amount:
          type: integer
        reference:
          type: string
        balance:
          type: integer
          description: The account balance now (right after the entry when it is new; the current balance
            on a replay).
        created_at:
          type: string
          format: date-time
        replayed:
          type: boolean
        source:
          type: string
          description: 'Present on a manual deposit: `manual`.'
        request_id:
          type: integer
        mpesa_receipt:
          type: string
    Reversal:
      type: object
      properties:
        id:
          type: integer
        reverses_id:
          type: integer
        account_id:
          type: integer
        type:
          type: string
          enum:
          - deposit
          - withdrawal
        amount:
          type: integer
        reference:
          type: string
        balance:
          type: integer
        created_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - deposit
          - withdrawal
        amount:
          type: integer
        reference:
          type: string
        created_at:
          type: string
          format: date-time
        reverses_id:
          type: integer
          nullable: true
    Summary:
      type: object
      properties:
        sacco_id:
          type: integer
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        account_count:
          type: integer
        total_balance:
          type: integer
        deposit_total:
          type: integer
        withdrawal_total:
          type: integer
        reversal_count:
          type: integer
    Activity:
      type: object
      properties:
        membership_id:
          type: integer
        email:
          type: string
        account_id:
          type: integer
        transaction_count:
          type: integer
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        actor_id:
          type: integer
          nullable: true
        action:
          type: string
        target:
          type: string
        created_at:
          type: string
          format: date-time
paths:
  /api/health:
    get:
      summary: Health check (unversioned)
      description: '**Who:** anyone.


        **Rate limit:** 120 per minute. Each call opens a database connection.'
      responses:
        '200':
          description: Database reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - healthy
                  database:
                    type: string
                    enum:
                    - connected
        '503':
          description: Database not configured or unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                    enum:
                    - not_configured
                    - disconnected
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/register:
    post:
      summary: Register an account
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        The password must be 8 to 128 characters and must not contain the email. The address starts unverified;
        login does not need it, but a SACCO admin can only add a verified user.'
      responses:
        '201':
          description: Created. A verification link is emailed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicts with current state (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 128
              required:
              - email
              - password
  /api/v1/auth/join:
    post:
      summary: Join a SACCO with a code
      description: |-
        **Who:** a signed-in user holding a join code.

        The code is six digits, valid for the SACCO's `join_code_ttl_minutes` (15 by default) and usable once. Five wrong entries burn it. Only a membership that is currently `invited` can be joined; a cancelled invite answers like a wrong code. A phone may be invited to several SACCOs: the code decides which one is joined, and a wrong code counts against every live code for that phone. On success the phone is linked to the user and a setup token (valid 10 minutes, tied to this code) is returned for setting the SACCO PIN; a re-invite makes older setup tokens invalid.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {type: string, maxLength: 20}
                code: {type: string, minLength: 6, maxLength: 6}
              required: [phone, code]
      responses:
        '200':
          description: Phone linked. Send the setup token to the PIN route.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_token: {type: string}
                  membership_id: {type: integer}
                required: [setup_token, membership_id]
        '400': {description: "Wrong code or unknown phone (CODE_WRONG).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Missing or invalid access token (unauthorized).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "Code already used or burned (CODE_USED), the phone belongs to another account, or the user is already a member.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: "Code expired (CODE_EXPIRED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: "Rate limit exceeded (rate_limited).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/join/pin:
    post:
      summary: Set the SACCO PIN and activate the membership
      description: |-
        **Who:** the signed-in user who just joined.

        Sets a four-digit PIN (stored hashed). The membership changes from invited to active.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token: {type: string}
                pin: {type: string, minLength: 4, maxLength: 4}
              required: [setup_token, pin]
      responses:
        '200':
          description: PIN set, membership active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership_id: {type: integer}
                  status: {type: string, enum: [active]}
                required: [membership_id, status]
        '400': {description: "The PIN is not exactly four digits.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Missing or invalid access token, or the setup token is invalid or expired.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "The setup token belongs to someone else (NOT_ALLOWED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "The membership is already set up.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: "Rate limit exceeded (rate_limited).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/join/rules:
    post:
      summary: The SACCO's rules, before the PIN step
      description: |-
        **Who:** the signed-in user who just joined (send the `setup_token` from `/auth/join`).

        Returns every rule of the SACCO being joined, so the member can read them before accepting.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token: {type: string}
              required: [setup_token]
      responses:
        '200':
          description: The current rules and whether this member accepted them (`rules` is null if the SACCO has none), plus the SACCO whose invitation is being read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: {allOf: [{$ref: '#/components/schemas/SaccoRules'}], nullable: true}
                  sacco:
                    type: object
                    nullable: true
                    description: The SACCO the invitation belongs to, which the rules screen names.
                    properties:
                      id: {type: integer, example: 1}
                      name: {type: string, example: Umoja SACCO}
                    required: [id, name]
        '401': {description: "Missing or invalid access token, or the setup token is invalid or expired.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "The setup token belongs to someone else (NOT_ALLOWED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/join/rules/accept:
    post:
      summary: Accept the SACCO's rules before joining
      description: |-
        **Who:** the signed-in user who just joined.

        Records that this member accepted this version. `/auth/join/pin` answers 409 `RULES_NOT_ACCEPTED` until it is done.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token: {type: string}
                version: {type: integer, example: 1}
              required: [setup_token, version]
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: {$ref: '#/components/schemas/SaccoRules'}
        '401': {description: "Missing or invalid access token, or the setup token is invalid or expired.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "The setup token belongs to someone else (NOT_ALLOWED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "The SACCO has no rules to accept.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "The rules changed; read the current version first.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/join/rules/decline:
    post:
      summary: Decline the SACCO's rules and refuse the invitation
      description: '**Who:** the signed-in user who just joined, after reading the rules.

        `reason` is required and is kept for the officers of the SACCO, who see it on the member
        (`decline_reason`). The membership becomes `declined` and is never activated: its join code is
        spent, so declining ends the invitation, and an officer must invite the person again to restart.
        Audited as `member.decline`. **Rate limit:** 30 per minute.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_token: {type: string}
                version: {type: integer, example: 1, description: "The rules version that was read (required when the SACCO has rules)."}
                reason: {type: string, maxLength: 500, description: "Why the invitation is refused, in the member's own words."}
              required: [setup_token, reason]
      responses:
        '200':
          description: '`{membership_id, status: declined}`.'
        '400': {description: "The reason is missing or too long (validation_error).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "Missing or invalid access token, or the setup token is invalid or expired.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "The setup token belongs to someone else, or the membership is already set up (NOT_ALLOWED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "The rules changed; read the current version first.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/sacco-login:
    post:
      summary: Enter your SACCO with its PIN (the new name)
      description: 'The same endpoint as `/auth/sacco-login`, kept under both names
        for one release so older clients keep working.


        **Rate limit:** 30 per minute.'
      responses:
        '200':
          description: '`{ok, membership_id, role}`; no new tokens are issued.'
        '401':
          description: Wrong PIN (`PIN_WRONG`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: '`PIN_LOCKED` after five wrong tries, or the SACCO is suspended.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/sacco-login:
    post:
      summary: Check the SACCO PIN
      description: |-
        **Who:** a signed-in user with an active membership in the SACCO.

        Five wrong PINs lock the PIN for 15 minutes (PIN_LOCKED).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sacco_id: {type: integer}
                pin: {type: string, minLength: 4, maxLength: 4}
              required: [sacco_id, pin]
      responses:
        '200':
          description: PIN correct.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  membership_id: {type: integer}
                  role: {type: string}
                required: [ok, membership_id, role]
        '401': {description: "Missing or invalid access token, or wrong PIN (PIN_WRONG).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "No active membership in that SACCO (NOT_ALLOWED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '423': {description: "The PIN is locked (PIN_LOCKED).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: "Rate limit exceeded (rate_limited).", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/auth/login:
    post:
      summary: Sign in
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        Five failed logins lock the account for 15 minutes (423). A suspended SACCO does not block login:
        the user sees it in GET /members/me/saccos, and the SACCO''s own endpoints answer 423.'
      responses:
        '200':
          description: Token pair plus who signed in. Access token lasts 15 minutes, refresh token 7 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                  user:
                    allOf:
                    - $ref: '#/components/schemas/Profile'
                    - type: object
                      properties:
                        is_platform_owner:
                          type: boolean
                required:
                - access_token
                - refresh_token
                - token_type
                - user
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 128
              required:
              - email
              - password
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: '**Who:** anyone holding a refresh token


        **Rate limit:** 30 per minute.


        Each refresh token works once. Replaying a spent token more than 10 seconds later revokes all
        of the user''s refresh tokens.'
      responses:
        '200':
          description: A new token pair. Always store the newest refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                required:
                - access_token
                - refresh_token
                - token_type
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  /api/v1/auth/logout:
    post:
      summary: Revoke one refresh token
      description: '**Who:** anyone holding a refresh token


        **Rate limit:** 30 per minute.'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  /api/v1/auth/logout-all:
    post:
      summary: End every session of the signed-in user
      description: '**Who:** any signed-in user, even if their SACCO is suspended


        **Rate limit:** 30 per minute.


        Writes the audit row `auth.logout_all`.'
      responses:
        '200':
          description: Every refresh token is revoked and every access token issued so far stops working,
            including this one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/auth/change-password:
    post:
      summary: Change the signed-in user's password
      description: '**Who:** any signed-in user, even if their SACCO is suspended


        **Rate limit:** 5 per minute (per IP).


        A wrong `current_password` is 401 and counts as a failed login (same lockout). The new password
        follows the register rules and must differ from the current one. Writes the audit row `auth.password_change`.'
      responses:
        '200':
          description: Password changed. All sessions end; sign in again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  maxLength: 128
                new_password:
                  type: string
                  maxLength: 128
              required:
              - current_password
              - new_password
  /api/v1/auth/verify-email:
    post:
      summary: Confirm an email address
      description: '**Who:** anyone holding the emailed token


        **Rate limit:** 5 per minute (per IP).


        The link is single-use and valid for 24 hours. 400 for a wrong, used or expired token.'
      responses:
        '200':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 100
              required:
              - token
  /api/v1/auth/resend-verification:
    post:
      summary: Send a new verification link
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        Replaces any earlier link for the user.'
      responses:
        '200':
          description: Always the same answer, whether or not the address exists or needs verifying.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  /api/v1/auth/forgot-password:
    post:
      summary: Email a password-reset link
      description: '**Who:** anyone


        **Rate limit:** 5 per minute (per IP).


        The link lasts 1 hour and replaces any earlier reset link. This is also how an account locked
        by repeated wrong guesses is recovered.'
      responses:
        '200':
          description: Always the same answer, whether or not the address has an account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  /api/v1/auth/reset-password:
    post:
      summary: Set a new password from an emailed link
      description: '**Who:** anyone holding the emailed token


        **Rate limit:** 5 per minute (per IP).


        The link works once. The new password follows the register rules. A successful reset also marks
        the email verified, clears the lockout and revokes every session. A weak password is 400 and does
        not spend the link. Writes the audit row `auth.password_reset`.'
      responses:
        '200':
          description: Password reset. Every session ends; sign in with the new password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 100
                new_password:
                  type: string
                  maxLength: 128
              required:
              - token
              - new_password
  /api/v1/members/me:
    get:
      summary: The caller's own profile
      description: '**Who:** any signed-in user


        **Rate limit:** 120 per minute.'
      responses:
        '200':
          description: Profile with memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    patch:
      summary: Change the caller's own email
      description: '**Who:** any signed-in user


        **Rate limit:** 30 per minute.


        Needs `current_password`. A wrong one is 403 and counts toward the lockout. Only `email` can change.'
      responses:
        '200':
          description: Updated profile. The new address is unverified, a link is emailed, and every session
            ends (sign in again).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Signed in but not allowed: wrong role or inactive membership (`forbidden`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicts with current state (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                current_password:
                  type: string
              required:
              - email
              - current_password
  /api/v1/members/me/photo:
    get:
      summary: Read the caller's profile photo
      description: >-
        **Who:** the signed-in account owner. The photo is private to that account.


        **Rate limit:** 120 per minute.
      responses:
        '200':
          description: The caller's saved profile photo.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '204':
          description: No profile photo has been saved.
        '401':
          description: Missing, invalid or expired access token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    put:
      summary: Save the caller's profile photo
      description: >-
        **Who:** the signed-in account owner. Send a `photo` file using
        `multipart/form-data`. JPEG, PNG and WebP images are accepted, up to 1.5 MB.


        **Rate limit:** 30 per minute.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
              required:
              - photo
      responses:
        '200':
          description: The photo was saved to the caller's account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
                required:
                - saved
        '400':
          description: Missing, empty or unsupported image (`validation_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The image is larger than 1.5 MB (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    delete:
      summary: Remove the caller's profile photo
      description: '**Who:** the signed-in account owner.


        **Rate limit:** 30 per minute.'
      responses:
        '200':
          description: The photo was removed from the caller's account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                required:
                - deleted
        '401':
          description: Missing, invalid or expired access token (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/saccos:
    get:
      summary: List SACCOs
      description: '**Who:** platform owner


        **Rate limit:** 120 per minute.'
      responses:
        '200':
          description: All SACCOs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saccos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sacco'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Signed in but not allowed: wrong role or inactive membership (`forbidden`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    post:
      summary: Create a SACCO
      description: '**Who:** platform owner


        **Rate limit:** 30 per minute.


        `currency` defaults to KES. The name is unique, up to 255 characters, with no control or zero-width
        characters. Optional: `registration_number`, `sasra_licence_number`, `registration_date` (see the
        Sacco schema); a bad value is 400 with the field named, a number already used by another SACCO is 409.'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sacco'
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
