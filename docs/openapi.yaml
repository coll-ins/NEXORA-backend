  /api/v1/savings/transactions/{transaction_id}/reversals:
    parameters:
    - $ref: '#/components/parameters/transaction_id'
    post:
      summary: Ask for a reversal of a ledger entry (first of two officers)
      description: '**Who:** a member of this SACCO holding `savings.reverse` (SACCO admin or finance officer)


        **Rate limit:** 20 per minute.


        Reversals take two officers (maker-checker). This call only **asks**: send `reason` (10 to 140
        characters, one line). Nothing is posted; a different officer approves with
        `POST /savings/reversal-requests/{request_id}/approve`. Nobody may ask to reverse an entry on their
        own account (403). An entry that is itself a reversal, a loan entry, or one already reversed is
        409. One request may be open per entry: the same officer asking again gets the same request
        (**200**); another officer gets 409.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, minLength: 10, maxLength: 140}
              required: [reason]
      responses:
        '201':
          description: 'The request: `{id, sacco_id, transaction_id, account_id, type, amount, requested_by, reason, status: pending, ...}`.'
        '200':
          description: The same officer already has this request open.
        '400':
          description: A missing or malformed reason (`validation_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already reversed, a reversal, a loan entry, or another officer's request is open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/savings/saccos/{sacco_id}/reversal-requests:
    parameters:
    - $ref: '#/components/parameters/sacco_id'
    get:
      summary: This SACCO's reversal requests
      description: '**Who:** a member holding `savings.reverse`. Newest first, at most 100. `?status=` is
        `pending`, `approved` or `rejected`.


        **Rate limit:** read limit.'
      responses:
        '200':
          description: '`{items: [request]}`.'
        '400':
          description: Unknown status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
  /api/v1/savings/reversal-requests/{request_id}/approve:
    parameters:
    - $ref: '#/components/parameters/request_id'
    post:
      summary: Approve a reversal request (the second officer) and append the entry
      description: '**Who:** a member holding `savings.reverse`, never the officer who asked (403
        `SECOND_OFFICER_REQUIRED`).


        **Rate limit:** 20 per minute.


        Send `reference` (the idempotency key). The opposite entry is appended now, with the same rules as
        before: nobody reverses an entry on their own account, a reversal that would take the balance below
        zero is 409, and one that would leave savings below an open loan''s cap is 409 `LOAN_OVER_CAP`. A
        SACCO admin (`savings.reverse_override`) may force that one by sending `override_reason` (10 to 140
        characters, one line); it is audited as `savings.reverse_override`. A retried approval with the same
        `reference` answers **200** with `replayed: true`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference: {type: string}
                override_reason: {type: string, minLength: 10, maxLength: 140}
              required: [reference]
      responses:
        '201':
          description: The new opposite entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reversal'
        '200':
          description: Replay of an approval that already went through.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reversal'
        '400':
          description: Validation error (`validation_error`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`forbidden`, `SECOND_OFFICER_REQUIRED`, or an override without `savings.reverse_override`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`REQUEST_ALREADY_DECIDED`, `LOAN_OVER_CAP`, `INSUFFICIENT_FUNDS`, or the entry was reversed meanwhile.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /api/v1/savings/reversal-requests/{request_id}/reject:
    parameters:
    - $ref: '#/components/parameters/request_id'
    post:
      summary: Reject a reversal request (a different officer)
      description: '**Who:** a member holding `savings.reverse`, never the officer who asked (403
        `SECOND_OFFICER_REQUIRED`). Send `reason` (10 to 140 characters). Nothing is posted.


