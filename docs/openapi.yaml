  /api/v1/savings/accounts/{account_id}/deposits:
    parameters:
    - $ref: '#/components/parameters/account_id'
    post:
      summary: Record a manual deposit from an M-Pesa receipt
      description: '**Who:** a member of this SACCO holding `savings.post` (SACCO admin or finance officer)


        **Rate limit:** 20 per minute.


        A manual deposit needs `amount` (minor units), `mpesa_receipt` (the code from the M-Pesa message,
        8 to 12 capital letters and digits) and `phone` (the payer). The ledger row is marked `source:
        manual`. One receipt is one payment per SACCO: recording it again with the same amount is a retry
        (**200**, `replayed: true`); any other repeat, or a receipt an M-Pesa callback already recorded,
        is 409 `DUPLICATE_RECEIPT`. A later callback for a receipt entered here is linked to it, not
        added. A **flagged** deposit (a manual entry at or over the SACCO''s limit, a large amount, or
        the same amount again and again) is not posted: it answers **202** `{queued: true, request}` with
        this officer''s first approval, and a different officer confirms it in the request queue. Holders
        of `savings.post` post money, others cannot (403), and nobody may post on their own account (403).
        Amounts are integers in minor units.'
      responses:
        '201':
          description: 'New entry (`source: manual`, with `request_id` and `mpesa_receipt`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posted'
        '202':
          description: 'Flagged: `{queued: true, request}`. Nothing is posted yet.'
        '200':
          description: Retry of the same receipt entered earlier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posted'
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid or expired access token, or wrong credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Signed in but not allowed: wrong role or inactive membership (`forbidden`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found, **including another SACCO's record** (`not_found`). Never 403 for tenant
            isolation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicts with current state (`conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: The user's SACCO is suspended, or the account is locked (`locked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (`rate_limited`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: 'Minor units (KES: 100 = 1.00). Integers only.'
                reference:
                  type: string
                  pattern: ^[A-Za-z0-9._:-]{1,64}$
                  description: Required idempotency key, unique per SACCO.
              required:
              - amount
              - reference
  /api/v1/savings/accounts/{account_id}/withdrawals:
    parameters:
    - $ref: '#/components/parameters/account_id'
    post:
      summary: Post a withdrawal
      description: '**Who:** a member of this SACCO holding `savings.post` (SACCO admin or finance officer)


        **Rate limit:** 20 per minute.


        Insufficient funds is 409 `Insufficient funds.`. `reference` is required. A new entry answers
        **201**; repeating the same reference with the same request answers **200** with `replayed: true`;
        the same reference with a different request is 409. Holders of `savings.post` (admin, finance officer) post money, others cannot
        (403), and nobody may post on their own account (403). A withdrawal that is **flagged** (large, the same amount again and again, or soon after a deposit; see `deposit-controls`) is 409 `NEEDS_SECOND_APPROVAL`: it goes through the member''s withdrawal request, which two officers approve. A withdrawal that would leave the savings below the loan cap of an open loan is 409 `LOAN_OVER_CAP` (SACCOs with published rules). Amounts are integers in minor units.'
      responses:
        '201':
          description: New entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posted'
        '200':
          description: Replay of an earlier request with the same reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posted'
        '400':
          description: Validation error (`validation_error`). Also bad paging or dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
