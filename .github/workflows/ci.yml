name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  tests-and-lint:
    name: Tests and lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for this job only. Never a real password.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-not-a-real-password
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI has no .env, so every setting the app reads at import time comes from
      # here. SECRET_KEY and the database password are throwaway values.
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
      # The health route reads DATABASE_URL; tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://postgres:ci-not-a-real-password@localhost:5432/nexora_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-not-a-real-password@localhost:5432/nexora_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The schema tests create nexora_schema_test themselves; the postgres
      # superuser created by the service above is allowed to do that.
      # Fails when total coverage is below fail_under in pyproject.toml.
      - name: Tests
        run: pytest -m "schema or not schema" --cov --cov-report=term-missing

      - name: Lint
        run: ruff check backend/app tests
